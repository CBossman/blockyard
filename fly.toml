# The game server on Fly.io: `fly deploy` (after `npm run wasm`). One machine, with a volume for
# the SQLite worlds; it sleeps when nobody's connected and wakes on the next visit.
app = "voxel-games"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

# The site's addresses: the pages that may use a player's sign-in (Sign in with Discord, whose
# application's id and secret are Fly secrets). The server answers at play.blockyard.gg,
# under the site's own domain, so its session cookie goes with the site's requests.
[env]
  SITE_ORIGINS = "https://blockyard.gg,https://blockyard.potrock.xyz"
  # Matches running at once (16 people each; a full public game overflows into another copy).
  # Measured 2026-09-26 on performance-1x: a match with bots takes about 3% of the CPU with one
  # viewer, a match full of people about 15% of a core; 14 was the limit there. Launch
  # (2026-09-27): performance-4x, four times the cores, one main thread for every socket: 40.
  ROOMS = "40"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 600
    hard_limit = 700

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Scaled up for launch (per-second billing: ~$0.17/hr vs $0.04 for performance-1x, with
# ROOMS 14 and connections 250/300); back down by putting those back.
[[vm]]
  size = "performance-4x"
  memory = "8192mb"
